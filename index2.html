<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn trắc nghiệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--fg:#1d2433;--mu:#667085;--c:#fff;--b:#d8d4ca;--ac:#1f4fd8;--ok:#13795b;--no:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#e8eaf0;--mu:#97a0b3;--c:#1d212c;--b:#343a4a;--ac:#7aa2ff;--ok:#4cd6a0;--no:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 16px 48px}
button,input,textarea{font:inherit;color:inherit}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:20px 0 4px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.g{background:transparent;color:var(--fg);border:1px solid var(--b)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:14px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt.ok{border-color:var(--ok);border-width:2px}.opt.no{border-color:var(--no);border-width:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px;margin:4px 0}
textarea{min-height:70px;font:14px/1.4 inherit}
.mu{color:var(--mu);font-size:14px}.big{font-size:44px;font-weight:700;margin:8px 0}
label{display:block;margin:6px 0}
</style>
</head>
<body>
<div id="app"><p class="mu">Đang tải...</p></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ADMIN="ztienbinhz@gmail.com";
const cfg={
  apiKey:"AIzaSyA9RbPKs4AJ_LFIjMGNcEVLbJno5yHIu1E",
  authDomain:"learning-efd5b.firebaseapp.com",
  projectId:"learning-efd5b",
  storageBucket:"learning-efd5b.firebasestorage.app",
  messagingSenderId:"269455780735",
  appId:"1:269455780735:web:1b94b11871f94b0270084a"
};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb);
const $=s=>document.querySelector(s),app=$('#app'),L="ABCDEFGH";
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pref=id=>doc(db,'users',user.uid,'progress',id);
let user=null,me='',isAdmin=false,decks=[],prog={},reqs={},pend={},allowed=[],arq=[],S={};
const canEdit=k=>k.ownerUid===user.uid||(k.editors||[]).includes(user.uid);
const fail=e=>{app.innerHTML=`<div class=card>Lỗi: ${esc(e.message)}<br><button class=btn onclick="logout()">Đăng xuất</button></div>`};

onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u)return loginView();
  me=u.email.toLowerCase();isAdmin=me===ADMIN;
  try{
    if(!isAdmin&&!(await getDoc(doc(db,'allowed',me))).exists())return gate();
    await load();home();
  }catch(e){fail(e)}
});

function loginView(){
  app.innerHTML=`<h1>Ôn trắc nghiệm</h1><p>Chỉ các email đã được duyệt mới vào được. Đăng nhập bằng Google để tiếp tục.</p><button class=btn onclick="login()">Đăng nhập bằng Google</button>`;
}

async function gate(){
  const sent=(await getDoc(doc(db,'accessRequests',me))).exists();
  app.innerHTML=`<h1>Chưa được duyệt</h1><p>Email <b>${esc(me)}</b> chưa có quyền vào web.</p>`+
  (sent?`<p class=mu>Đã gửi yêu cầu. Hãy chờ quản trị viên duyệt rồi tải lại trang.</p>`:`<button class=btn onclick="reqAccess()">Gửi yêu cầu truy cập</button>`)+
  ` <button class="btn g" onclick="logout()">Đăng xuất</button>`;
}
async function reqAccess(){await setDoc(doc(db,'accessRequests',me),{email:me,t:Date.now()});gate()}

async function load(){
  const[d,p]=await Promise.all([getDocs(collection(db,'decks')),getDocs(collection(db,'users',user.uid,'progress'))]);
  decks=d.docs.map(x=>({id:x.id,...x.data()}));prog={};p.docs.forEach(x=>prog[x.id]=x.data());
  reqs={};pend={};
  await Promise.all(decks.map(async k=>{
    if(k.ownerUid===user.uid){reqs[k.id]=(await getDocs(collection(db,'decks',k.id,'requests'))).docs.map(x=>({id:x.id,...x.data()}))}
    else if(!canEdit(k)){pend[k.id]=(await getDoc(doc(db,'decks',k.id,'requests',user.uid))).exists()}
  }));
  if(isAdmin){
    const[a,r]=await Promise.all([getDocs(collection(db,'allowed')),getDocs(collection(db,'accessRequests'))]);
    allowed=a.docs.map(x=>x.id);arq=r.docs.map(x=>x.id);
  }
}

function home(){
  const pr=decks.filter(k=>(reqs[k.id]||[]).length);
  app.innerHTML=`<div class=row><h1>Các môn học</h1><span class=mu>${esc(me)}${isAdmin?' (quản trị viên)':''} <button class="btn g" onclick="logout()">Đăng xuất</button></span></div>`+
  (isAdmin?`<div class=card><b>Quản lý email được vào web</b>
    ${arq.map(e=>`<div class=row><span>${esc(e)} <span class=mu>xin truy cập</span></span><span><button class=btn onclick="okAccess('${esc(e)}')">Duyệt</button> <button class="btn g" onclick="noAccess('${esc(e)}')">Từ chối</button></span></div>`).join('')}
    ${allowed.map(e=>`<div class=row><span class=mu>${esc(e)}</span><button class="btn g" onclick="rmAccess('${esc(e)}')">Gỡ</button></div>`).join('')}
    <input type=text id=ne placeholder="Thêm email được phép, ví dụ ban@gmail.com"><button class=btn onclick="addAccess()">Thêm email</button></div>`:'')+
  (pr.length?`<div class=card><b>Yêu cầu quyền sửa</b>`+pr.map(k=>reqs[k.id].map(r=>`<div class=row><span>${esc(r.email)} xin sửa «${esc(k.name)}»</span><span><button class=btn onclick="okReq('${k.id}','${r.id}')">Đồng ý</button> <button class="btn g" onclick="noReq('${k.id}','${r.id}')">Từ chối</button></span></div>`).join('')).join('')+`</div>`:'')+
  (decks.length?decks.map(k=>{
    const p=prog[k.id]||{},h=(p.hist||[]).slice(-1)[0],mine=k.ownerUid===user.uid,ed=canEdit(k);
    return `<div class=card><div class=row><div><b>${esc(k.name)}</b><div class=mu>${k.n} câu · ${(p.wrong||[]).length} câu sai · đăng bởi ${esc(k.ownerEmail)}${h?` · gần nhất ${h.s}/${h.n}`:''}</div>
    ${mine&&(k.editorEmails||[]).length?`<div class=mu>Người được sửa: ${k.editorEmails.map((e,i)=>`${esc(e)} <a href="#" onclick="rmEd('${k.id}',${i});return false">gỡ</a>`).join(', ')}</div>`:''}</div>
    <div><button class=btn onclick="openDeck('${k.id}')">Học</button>
    ${ed?`<button class="btn g" onclick="editDeck('${k.id}')">Sửa</button>`:pend[k.id]?`<span class=mu>Đã xin quyền sửa</span>`:`<button class="btn g" onclick="reqEdit('${k.id}')">Xin quyền sửa</button>`}
    ${mine?`<button class="btn g" onclick="delDeck('${k.id}')">Xóa</button>`:''}</div></div></div>`;
  }).join(''):`<div class=card>Chưa có môn nào. Thêm môn đầu tiên ở bên dưới.</div>`)+
  `<div class=card><b>Thêm môn học</b>
  <input type=text id=dn placeholder="Tên môn">
  <label class=mu>Chọn file .json <input type=file id=df accept=".json,application/json"></label>
  <textarea id=dt placeholder='Hoặc dán JSON:\n[{"q":"Câu hỏi?","options":["Đáp án A","Đáp án B","Đáp án C","Đáp án D"],"answer":"B","explain":"Giải thích (không bắt buộc)"}]'></textarea>
  <button class=btn onclick="addDeck()">Thêm môn</button></div>`;
}

async function addAccess(){const e=$('#ne').value.trim().toLowerCase();if(!e.includes('@'))return alert('Email không hợp lệ.');await setDoc(doc(db,'allowed',e),{by:me});await load();home()}
async function okAccess(e){await setDoc(doc(db,'allowed',e),{by:me});await deleteDoc(doc(db,'accessRequests',e));await load();home()}
async function noAccess(e){await deleteDoc(doc(db,'accessRequests',e));await load();home()}
async function rmAccess(e){if(!confirm('Gỡ quyền của '+e+'?'))return;await deleteDoc(doc(db,'allowed',e));await load();home()}

async function reqEdit(id){await setDoc(doc(db,'decks',id,'requests',user.uid),{email:me,t:Date.now()});await load();home()}
async function okReq(id,uid){
  const r=reqs[id].find(x=>x.id===uid);
  await updateDoc(doc(db,'decks',id),{editors:arrayUnion(uid),editorEmails:arrayUnion(r.email)});
  await deleteDoc(doc(db,'decks',id,'requests',uid));await load();home();
}
async function noReq(id,uid){await deleteDoc(doc(db,'decks',id,'requests',uid));await load();home()}
async function rmEd(id,i){
  const k=decks.find(x=>x.id===id),ed=[...k.editors],em=[...k.editorEmails];ed.splice(i,1);em.splice(i,1);
  await updateDoc(doc(db,'decks',id),{editors:ed,editorEmails:em});await load();home();
}

function norm(a){
  if(a&&!Array.isArray(a)&&typeof a==='object')a=a.questions||a.data||a.items||Object.values(a).find(Array.isArray);
  if(!Array.isArray(a)||!a.length)throw Error('Không tìm thấy danh sách câu hỏi. Hãy kiểm tra lại định dạng.');
  return a.map((x,i)=>{
    const q=x.q||x.question,o=x.options||x.o,r=x.answer??x.a??x.correct;
    const k=typeof r==='number'?r:L.indexOf(String(r??'').trim().toUpperCase()[0]);
    if(!q||!Array.isArray(o)||o.length<2||!(k>=0&&k<o.length))throw Error('Câu '+(i+1)+' thiếu nội dung, đáp án hoặc đáp án đúng không hợp lệ.');
    return {q:String(q),o:o.map(String),a:k,e:x.explain||x.e||''};
  });
}

async function addDeck(){
  const name=$('#dn').value.trim().normalize('NFC'),f=$('#df').files[0];
  let txt=(f?await f.text():$('#dt').value).trim().replace(/^\uFEFF/,'').normalize('NFC'),q;
  if(!name)return alert('Nhập tên môn.');
  try{q=norm(JSON.parse(txt))}catch(e){return alert('Lỗi dữ liệu: '+e.message)}
  const id=Date.now().toString(36);
  await setDoc(doc(db,'decks',id),{ownerUid:user.uid,ownerEmail:me,name,qs:JSON.stringify(q),n:q.length,editors:[],editorEmails:[]});
  await load();home();
}
async function delDeck(id){
  const k=decks.find(x=>x.id===id);
  if(!confirm('Xóa môn "'+k.name+'" cho tất cả mọi người?'))return;
  await deleteDoc(doc(db,'decks',id));await deleteDoc(pref(id)).catch(()=>{});await load();home();
}

const qe=q=>`<div class="card qe"><textarea class=eq placeholder="Câu hỏi">${esc(q.q)}</textarea><textarea class=eo placeholder="Mỗi đáp án một dòng">${esc(q.o.join('\n'))}</textarea><input type=text class=ea placeholder="Đáp án đúng (A, B, C...)" value="${L[q.a]}"><input type=text class=ee placeholder="Giải thích (không bắt buộc)" value="${esc(q.e)}"><button class="btn g" onclick="this.closest('.qe').remove()">Xóa câu</button></div>`;
function editDeck(id){
  const k=decks.find(x=>x.id===id);k.q=JSON.parse(k.qs);S={d:k};
  app.innerHTML=`<div class=row><button class="btn g" onclick="home()">Hủy</button><button class=btn onclick="saveEdit()">Lưu thay đổi</button></div><h1>Sửa môn</h1><input type=text id=en value="${esc(k.name)}"><div id=ql>${k.q.map(qe).join('')}</div><button class="btn g" onclick="addQ()">Thêm câu</button>`;
}
function addQ(){$('#ql').insertAdjacentHTML('beforeend',qe({q:'',o:['','','',''],a:0,e:''}))}
async function saveEdit(){
  const a=[...document.querySelectorAll('.qe')].map(c=>({q:c.querySelector('.eq').value.trim(),options:c.querySelector('.eo').value.split('\n').map(s=>s.trim()).filter(Boolean),answer:c.querySelector('.ea').value,explain:c.querySelector('.ee').value.trim()}));
  let q;try{q=norm(a)}catch(e){return alert(e.message)}
  try{await updateDoc(doc(db,'decks',S.d.id),{name:$('#en').value.trim()||S.d.name,qs:JSON.stringify(q),n:q.length})}catch(e){return alert('Không lưu được: '+e.message)}
  await load();home();
}

function openDeck(id){
  const d=decks.find(x=>x.id===id);d.q=d.q||JSON.parse(d.qs);
  S={d};const w=(prog[id]?.wrong||[]).filter(i=>d.q[i]).length;
  app.innerHTML=`<button class="btn g" onclick="home()">Quay lại</button><h1>${esc(d.name)}</h1><div class=mu>${d.n} câu · ${w} câu sai cần ôn</div>
  <div class=card>
  <label><input type=radio name=m value=practice checked> Luyện tập: có đáp án và giải thích sau mỗi câu</label>
  <label><input type=radio name=m value=exam> Thi thử: chấm điểm ở cuối</label>
  <label><input type=radio name=m value=wrong> Ôn câu sai (${w} câu)</label>
  <label><input type=checkbox id=sh checked> Xáo trộn thứ tự câu</label>
  <label>Số câu (0 = tất cả) <input type=number id=nn value=0 min=0></label>
  <button class=btn onclick="start()">Bắt đầu</button></div>`;
}
function start(){
  const d=S.d,mode=document.querySelector('input[name=m]:checked').value;
  let idx=mode==='wrong'?(prog[d.id]?.wrong||[]).filter(i=>d.q[i]):d.q.map((_,i)=>i);
  if(!idx.length)return alert('Chưa có câu sai để ôn.');
  if($('#sh').checked)shuffle(idx);
  const n=+$('#nn').value;if(n>0)idx=idx.slice(0,n);
  S={d,mode,idx,i:0,score:0,ans:null,log:[],wrong:new Set((prog[d.id]?.wrong||[]).filter(i=>d.q[i]))};
  quiz();
}
function quiz(){
  const{d,idx,i}=S;
  if(i>=idx.length)return result();
  const q=d.q[idx[i]],a=S.ans;
  app.innerHTML=`<div class=row><button class="btn g" onclick="openDeck('${d.id}')">Thoát</button><span class=mu>Câu ${i+1}/${idx.length} · đúng ${S.score}</span></div>
  <div class=card><b>${esc(q.q)}</b></div>`+
  q.o.map((t,k)=>`<button class="opt ${a!==null?(k===q.a?'ok':k===a?'no':''):''}" onclick="pick(${k})">${L[k]}. ${esc(t)}</button>`).join('')+
  (a!==null?(q.e?`<div class=card>${esc(q.e)}</div>`:'')+`<button class=btn onclick="nextQ()">Câu tiếp</button>`:'');
}
function pick(k){
  if(S.ans!==null)return;
  const qi=S.idx[S.i],q=S.d.q[qi];
  if(k===q.a){S.score++;S.wrong.delete(qi)}else{S.wrong.add(qi);S.log.push({qi,k})}
  prog[S.d.id]={...(prog[S.d.id]||{}),wrong:[...S.wrong]};
  setDoc(pref(S.d.id),{wrong:[...S.wrong]},{merge:true}).catch(()=>{});
  if(S.mode==='exam'){S.i++}else{S.ans=k}
  quiz();
}
function nextQ(){S.i++;S.ans=null;quiz()}
async function result(){
  const{d,idx,score,log}=S,p=Math.round(100*score/idx.length);
  const h=(prog[d.id]?.hist||[]).slice(-19);h.push({t:Date.now(),s:score,n:idx.length,m:S.mode});
  prog[d.id]={...(prog[d.id]||{}),wrong:[...S.wrong],hist:h};
  setDoc(pref(d.id),prog[d.id]).catch(()=>{});
  app.innerHTML=`<h1>Kết quả</h1><div class=big>${score}/${idx.length} <span class=mu>(${p}%)</span></div>
  <div class=row><button class=btn onclick="openDeck('${d.id}')">Làm lại</button><button class="btn g" onclick="home()">Về danh sách môn</button></div>`+
  (log.length?`<h2>Các câu làm sai</h2>`+log.map(({qi,k})=>{const q=d.q[qi];return `<div class=card><b>${esc(q.q)}</b><div class=mu>Bạn chọn: ${L[k]}. ${esc(q.o[k])}</div><div style="color:var(--ok)">Đúng: ${L[q.a]}. ${esc(q.o[q.a])}</div>${q.e?`<div class=mu>${esc(q.e)}</div>`:''}</div>`}).join(''):'');
}

Object.assign(window,{
  home,openDeck,start,pick,nextQ,addDeck,delDeck,editDeck,addQ,saveEdit,reqEdit,okReq,noReq,rmEd,reqAccess,addAccess,okAccess,noAccess,rmAccess,
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert('Đăng nhập lỗi: '+e.message)),
  logout:()=>signOut(auth)
});
</script>
</body>
</html>
